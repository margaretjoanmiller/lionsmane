[project]
name = "lionsmane"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.136.1",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "psycopg>=3.3.4",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "lefthook>=2.1.6",
    "ruff>=0.15.13",
    "ty>=0.0.35",
]

[tool.fastapi]
entrypoint = "app.main:app"


[tool.ruff.lint]
select = ["FAST", "B", "ASYNC", "S", "SIM"]
